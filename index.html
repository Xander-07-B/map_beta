<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔</text></svg>">
    <title>钢铁雄心4 · 网页版</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 启动菜单 -->
    <div id="startScreen" class="screen active">
        <div class="start-menu">
            <h1 class="game-title">钢铁雄心 <span class="title-4">IV</span></h1>
            <p class="subtitle">网页策略版 · 单人模式</p>
            <div class="menu-buttons">
                <button id="btnNewGame" class="menu-btn">新游戏</button>
                <button id="btnContinue" class="menu-btn" disabled>继续游戏</button>
                <button id="btnCredits" class="menu-btn">关于</button>
            </div>
            <div id="countrySelect" class="country-select hidden">
                <h3>选择国家</h3>
                <div id="countryList" class="country-list"></div>
            </div>
            <div id="aboutBox" class="about-box hidden">
                <h3>关于</h3>
                <p>《钢铁雄心4》网页复刻版，单人模式。包含完整的地图、政治、经济、工业、科技、生产、外交与军事系统。</p>
                <p>时间跨度：1936 年 — 1948 年。</p>
            </div>
        </div>
    </div>

    <!-- 主游戏界面 -->
    <div id="gameScreen" class="screen">
        <!-- 顶部工具栏 -->
        <header id="topBar">
            <div class="top-left">
                <span id="countryTag" class="country-tag"></span>
                <span id="countryName" class="country-name"></span>
            </div>
            <div class="top-center">
                <div class="date-display"><span id="dateText">1936.01.01</span></div>
                <div class="speed-controls">
                    <button data-speed="0" class="speed-btn active" title="暂停">❚❚</button>
                    <button data-speed="1" class="speed-btn" title="1级速度">▶</button>
                    <button data-speed="2" class="speed-btn" title="2级速度">▶▶</button>
                    <button data-speed="3" class="speed-btn" title="3级速度">▶▶▶</button>
                    <button data-speed="4" class="speed-btn" title="4级速度">▶▶▶▶</button>
                </div>
            </div>
            <div class="top-right">
                <button id="btnMenu" class="top-btn">菜单</button>
            </div>
        </header>

        <!-- 主区域：地图 -->
        <div id="mainArea">
            <div id="mapContainer">
                <canvas id="gameMap"></canvas>
                <!-- 地图工具栏 -->
                <div id="mapTools" class="map-tools">
                    <button class="tool-btn active" data-tool="move" title="移动/选择">◇</button>
                    <button class="tool-btn" data-tool="front" title="前线">≡</button>
                    <button class="tool-btn" data-tool="resources" title="资源">◎</button>
                    <button class="tool-btn" data-tool="province" title="省份信息">ℹ</button>
                </div>
                <!-- 小地图 -->
                <div id="minimapContainer"></div>
                <div class="map-hint">拖动平移 · 滚轮缩放 · 点击选择省份</div>
            </div>
        </div>

        <!-- 左侧图标栏（桌面在右，移动端沉底） -->
        <nav id="iconRail">
            <button class="rail-btn active" data-panel="overview"><span class="rb-icon">▤</span><span class="rb-label">总览</span></button>
            <button class="rail-btn" data-panel="politics"><span class="rb-icon">⚖</span><span class="rb-label">政治</span></button>
            <button class="rail-btn" data-panel="economy"><span class="rb-icon">◈</span><span class="rb-label">经济</span></button>
            <button class="rail-btn" data-panel="production"><span class="rb-icon">⚙</span><span class="rb-label">生产</span></button>
            <button class="rail-btn" data-panel="tech"><span class="rb-icon">⚛</span><span class="rb-label">科技</span></button>
            <button class="rail-btn" data-panel="diplomacy"><span class="rb-icon">☥</span><span class="rb-label">外交</span></button>
            <button class="rail-btn" data-panel="intelligence"><span class="rb-icon">⊙</span><span class="rb-label">情报</span></button>
            <button class="rail-btn" data-panel="log"><span class="rb-icon">☰</span><span class="rb-label">日志</span></button>
        </nav>

        <!-- 底部状态栏 -->
        <footer id="bottomBar">
            <div class="stat-group" id="statResources"></div>
            <div class="stat-group" id="statManpower"></div>
            <div class="stat-group" id="statIndustry"></div>
            <div class="stat-group" id="statMilitary"></div>
        </footer>
    </div>

    <!-- 面板弹窗遮罩 -->
    <div id="panelModalBackdrop" class="hidden"></div>

    <!-- 面板弹窗（滑入式） -->
    <div id="panelModal" class="hidden">
        <div class="panel-modal-header">
            <span class="panel-modal-title" id="panelModalTitle">总览</span>
            <button class="panel-modal-close" id="panelModalClose">✕</button>
        </div>
        <div id="panelContent" class="panel-content"></div>
    </div>

    <!-- 通用模态框 -->
    <div id="modal" class="modal hidden">
        <div class="modal-box">
            <h3 id="modalTitle">提示</h3>
            <div id="modalBody"></div>
            <div class="modal-buttons" id="modalButtons"></div>
        </div>
    </div>

    <!-- 事件弹窗 -->
    <div id="eventOverlay" class="event-overlay hidden">
        <div class="event-box">
            <h2 id="eventTitle"></h2>
            <div id="eventText"></div>
            <div id="eventChoices" class="event-choices"></div>
        </div>
    </div>

    <!-- 加载提示 -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="loading-box">
            <div class="loading-spinner"></div>
            <p id="loadingText">正在加载世界地图…</p>
        </div>
    </div>

    <!-- 脚本 -->
    <script src="vendor/d3.min.js"></script>
    <script src="vendor/topojson-client.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/map.js"></script>
    <script src="js/game.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
