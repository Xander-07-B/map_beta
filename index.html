<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔</text></svg>">
    <title>随便地图 · beta</title>
    <script>
        // 尽早确定主题，避免刷新时先闪一下深色界面
        (function () {
            try {
                var saved = localStorage.getItem('hoi4_theme');
                document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'dark';
            } catch (e) {
                document.documentElement.dataset.theme = 'dark';
            }
        })();
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 启动菜单 -->
    <div id="startScreen" class="screen active">
        <button id="startThemeToggle" class="theme-toggle" data-theme-toggle
                type="button" aria-label="切换主题" title="切换到浅色主题">☀</button>
        <!-- 背景装饰：线路与站点 -->
        <svg class="start-decor" viewBox="0 0 1000 900" aria-hidden="true">
            <defs>
                <linearGradient id="decorBlue" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#3b82f6" stop-opacity="0"/>
                    <stop offset=".45" stop-color="#3b82f6" stop-opacity=".6"/>
                    <stop offset="1" stop-color="#60a5fa" stop-opacity=".12"/>
                </linearGradient>
                <linearGradient id="decorTeal" x1="0" y1="1" x2="1" y2="0">
                    <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
                    <stop offset=".5" stop-color="#2dd4bf" stop-opacity=".45"/>
                    <stop offset="1" stop-color="#2dd4bf" stop-opacity=".1"/>
                </linearGradient>
                <linearGradient id="decorGold" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#fbbf24" stop-opacity="0"/>
                    <stop offset=".5" stop-color="#fbbf24" stop-opacity=".4"/>
                    <stop offset="1" stop-color="#fb923c" stop-opacity=".1"/>
                </linearGradient>
                <radialGradient id="decorGlow">
                    <stop offset="0" stop-color="#3b82f6" stop-opacity=".2"/>
                    <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
                </radialGradient>
            </defs>
            <circle cx="560" cy="450" r="430" fill="url(#decorGlow)"/>
            <g fill="none" stroke-linecap="round">
                <path d="M40 700 C 260 600, 300 400, 540 430 S 840 300, 1020 340"
                      stroke="url(#decorBlue)" stroke-width="4"/>
                <path d="M120 220 C 320 280, 340 540, 580 570 S 860 700, 1030 650"
                      stroke="url(#decorTeal)" stroke-width="3" opacity=".85"/>
                <path d="M-20 470 C 200 500, 400 270, 660 300 S 900 470, 1040 430"
                      stroke="url(#decorGold)" stroke-width="3" opacity=".75"/>
            </g>
            <g fill="#081120" stroke-width="3">
                <circle cx="250" cy="633" r="7" stroke="#3b82f6"/>
                <circle cx="414" cy="463" r="7" stroke="#3b82f6"/>
                <circle cx="540" cy="430" r="9" stroke="#60a5fa"/>
                <circle cx="790" cy="345" r="7" stroke="#3b82f6"/>
                <circle cx="330" cy="330" r="6" stroke="#2dd4bf"/>
                <circle cx="580" cy="570" r="9" stroke="#2dd4bf"/>
                <circle cx="820" cy="668" r="6" stroke="#2dd4bf"/>
                <circle cx="200" cy="490" r="6" stroke="#fbbf24"/>
                <circle cx="660" cy="300" r="8" stroke="#fbbf24"/>
                <circle cx="930" cy="452" r="6" stroke="#fb923c"/>
            </g>
            <g fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1">
                <circle cx="560" cy="450" r="300"/>
                <circle cx="560" cy="450" r="180"/>
            </g>
        </svg>

        <div class="start-menu">
            <h1 class="game-title">随便地图 <span class="title-4">beta</span></h1>
            <p class="subtitle">网页策略版 · 单人模式</p>
            <div class="menu-buttons">
                <button id="btnNewGame" class="menu-btn primary">
                    <span class="mb-icon">▶</span>
                    <span class="mb-label">新游戏</span>
                    <span class="mb-arrow">›</span>
                </button>
                <button id="btnContinue" class="menu-btn" disabled>
                    <span class="mb-icon">⏱</span>
                    <span class="mb-label">继续游戏</span>
                    <span class="mb-arrow">›</span>
                </button>
                <button id="btnCredits" class="menu-btn">
                    <span class="mb-icon">ⓘ</span>
                    <span class="mb-label">关于</span>
                    <span class="mb-arrow">›</span>
                </button>
            </div>
            <div id="countrySelect" class="country-select hidden">
                <h3>选择国家</h3>
                <div id="countryList" class="country-list"></div>
            </div>
            <div id="aboutBox" class="about-box hidden">
                <h3>关于</h3>
                <p>《随便地图》，单人模式。包含完整的地图、政治、经济、工业、科技、生产、外交与军事系统。</p>
                <p>时间跨度：1936 年 — 1948 年。</p>
            </div>
        </div>
    </div>

    <!-- 主游戏界面 -->
    <div id="gameScreen" class="screen">
        <!-- 顶部工具栏 -->
        <header id="topBar">
            <div class="top-left">
                <span id="countryTag" class="country-tag"></span>
                <span id="countryName" class="country-name"></span>
            </div>
            <div class="top-center">
                <div class="date-display">
                    <span id="dateText">1936.01.01</span>
                    <span id="pauseHint" class="pause-hint hidden">已暂停</span>
                </div>
                <div class="speed-controls">
                    <button data-speed="0" class="speed-btn active" title="暂停">
                        <span class="sb-icon">❚❚</span><span class="sb-num">停</span>
                    </button>
                    <button data-speed="1" class="speed-btn" title="1 级速度">
                        <span class="sb-icon">▶</span><span class="sb-num">1</span>
                    </button>
                    <button data-speed="2" class="speed-btn" title="2 级速度">
                        <span class="sb-icon">▶</span><span class="sb-num">2</span>
                    </button>
                    <button data-speed="3" class="speed-btn" title="3 级速度">
                        <span class="sb-icon">▶</span><span class="sb-num">3</span>
                    </button>
                    <button data-speed="4" class="speed-btn" title="4 级速度">
                        <span class="sb-icon">▶</span><span class="sb-num">4</span>
                    </button>
                    <button data-speed="5" class="speed-btn" title="5 级速度">
                        <span class="sb-icon">▶</span><span class="sb-num">5</span>
                    </button>
                    <button data-speed="6" class="speed-btn" title="6 级速度">
                        <span class="sb-icon">▶</span><span class="sb-num">6</span>
                    </button>
                    <button data-speed="8" class="speed-btn" title="8 级速度（最快）">
                        <span class="sb-icon">⏭</span><span class="sb-num">8</span>
                    </button>
                </div>
            </div>
            <div class="top-right">
                <button id="btnAI" class="top-btn" title="切换 AI 接管：所有非玩家国家由 AI 决策">AI</button>
                <button class="theme-toggle" data-theme-toggle
                        type="button" aria-label="切换主题" title="切换到浅色主题">☀</button>
                <button id="btnMenu" class="top-btn">菜单</button>
            </div>
        </header>

        <!-- 主区域：地图 -->
        <div id="mainArea">
            <div id="mapContainer">
                <canvas id="gameMap"></canvas>
                <!-- 地图工具栏 -->
                <div id="mapTools" class="map-tools">
                    <button class="tool-btn active" data-tool="move" title="移动/选择">◇</button>
                    <button class="tool-btn" data-tool="front" title="前线">≡</button>
                    <button class="tool-btn" data-tool="resources" title="资源">◎</button>
                    <button class="tool-btn" data-tool="province" title="省份信息">ℹ</button>
                </div>
                <!-- 小地图 -->
                <div id="minimapContainer"></div>
                <!-- 选中省份速览（查看驻军 / 快捷部署） -->
                <div id="provinceCard" class="province-card hidden"></div>
                <div class="map-hint">拖动平移 · 滚轮缩放 · 点省份查看 · 点部队后点相邻省份移动</div>
            </div>
        </div>

        <!-- 左侧图标栏（桌面在右，移动端沉底） -->
        <nav id="iconRail">
            <button class="rail-btn active" data-panel="overview"><span class="rb-icon">▤</span><span class="rb-label">总览</span></button>
            <button class="rail-btn" data-panel="politics"><span class="rb-icon">⚖</span><span class="rb-label">政治</span></button>
            <button class="rail-btn" data-panel="economy"><span class="rb-icon">◈</span><span class="rb-label">经济</span></button>
            <button class="rail-btn" data-panel="production"><span class="rb-icon">⚙</span><span class="rb-label">生产</span></button>
            <button class="rail-btn" data-panel="army"><span class="rb-icon">⚔</span><span class="rb-label">部队</span></button>
            <button class="rail-btn" data-panel="tech"><span class="rb-icon">⚛</span><span class="rb-label">科技</span></button>
            <button class="rail-btn" data-panel="diplomacy"><span class="rb-icon">☥</span><span class="rb-label">外交</span></button>
            <button class="rail-btn" data-panel="war"><span class="rb-icon">⚔</span><span class="rb-label">战争</span></button>
            <button class="rail-btn" data-panel="intelligence"><span class="rb-icon">⊙</span><span class="rb-label">情报</span></button>
            <button class="rail-btn" data-panel="notices"><span class="rb-icon">☰</span><span class="rb-label">通知</span></button>
            <button class="rail-btn" data-panel="log"><span class="rb-icon">▦</span><span class="rb-label">日志</span></button>
        </nav>

        <!-- 底部状态栏 -->
        <footer id="bottomBar">
            <div class="stat-group" id="statResources"></div>
            <div class="stat-group" id="statManpower"></div>
            <div class="stat-group" id="statIndustry"></div>
            <div class="stat-group" id="statMilitary"></div>
        </footer>
    </div>

    <!-- 面板弹窗遮罩 -->
    <div id="panelModalBackdrop" class="hidden"></div>

    <!-- 面板弹窗（滑入式） -->
    <div id="panelModal" class="hidden">
        <div class="panel-modal-header">
            <span class="panel-modal-title" id="panelModalTitle">总览</span>
            <button class="panel-modal-close" id="panelModalClose">✕</button>
        </div>
        <div id="panelContent" class="panel-content"></div>
    </div>

    <!-- 通用模态框 -->
    <div id="modal" class="modal hidden">
        <div class="modal-box">
            <h3 id="modalTitle">提示</h3>
            <div id="modalBody"></div>
            <div class="modal-buttons" id="modalButtons"></div>
        </div>
    </div>

    <!-- 事件弹窗 -->
    <div id="eventOverlay" class="event-overlay hidden">
        <div class="event-box">
            <h2 id="eventTitle"></h2>
            <div id="eventText"></div>
            <div id="eventChoices" class="event-choices"></div>
        </div>
    </div>

    <!-- 轻量提示条（部署 / 移动反馈） -->
    <div id="toast" class="toast"></div>

    <!-- 加载提示 -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="loading-box">
            <div class="loading-spinner"></div>
            <p id="loadingText">正在加载世界地图…</p>
        </div>
    </div>

    <!-- 脚本 -->
    <script src="vendor/d3.min.js"></script>
    <script src="vendor/topojson-client.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/map.js"></script>
    <script src="js/game.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
    <!-- 战役核心（ES 模块，挂载 window.Core，供后续集成取用） -->
    <script type="module" src="js/core/index.js"></script>
</body>
</html>
